name: Club Discord Server Discovery

on:
  schedule:
    # Runs daily at 14:15 UTC (6:15 AM PST / 7:15 AM PDT), offset from the :00 2-hour feed sync and 10:30 roster sync
    - cron: "15 14 * * *"
  push:
    branches:
      - main
    paths:
      - "collector/clubs.json"
  workflow_dispatch:
    inputs:
      force_crawl_all:
        description: "Crawl all club websites/Linktrees even if the club already has a known Discord invite"
        required: false
        default: false
        type: boolean
      force_refresh_invites:
        description: "Bypass the 12-hour Discord Invite API cache and re-verify every invite live"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  discover-discord-servers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Discord scout & collector state
        uses: actions/cache@v4
        with:
          path: |
            collector/output/discord-scout-cache.json
            collector/output/claude-cache.json
            collector/output/roster-cache.json
          key: clubhub-discord-scout-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            clubhub-discord-scout-cache-${{ runner.os }}-
            clubhub-collector-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Discover club Discord servers & inspect followable announcement channels
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_AGGREGATOR_GUILD_ID: ${{ secrets.DISCORD_AGGREGATOR_GUILD_ID }}
          DISCORD_FOLLOW_TARGET_CHANNEL_ID: ${{ secrets.DISCORD_FOLLOW_TARGET_CHANNEL_ID }}
          FORCE_CRAWL_ALL: ${{ inputs.force_crawl_all && 'true' || 'false' }}
          FORCE_REFRESH_INVITES: ${{ inputs.force_refresh_invites && 'true' || 'false' }}
        run: |
          EXTRA_FLAGS="--auto-follow"
          if [ "$FORCE_CRAWL_ALL" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --force-crawl"
          fi
          if [ "$FORCE_REFRESH_INVITES" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --force-refresh"
          fi
          node --no-warnings server/scoutDiscordServers.js $EXTRA_FLAGS

      - name: Persist discovered club Discord servers & followability snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/clubs.json public/clubhub-data.json public/discord-scout.json
          if ! git diff --cached --quiet; then
            cp collector/clubs.json /tmp/clubs.scouted.json
            cp public/clubhub-data.json /tmp/clubhub-data.scouted.json
            cp public/discord-scout.json /tmp/discord-scout.scouted.json
            git commit -m "chore: auto-discover club Discord servers [skip ci]"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/clubs.scouted.json collector/clubs.json
              cp /tmp/clubhub-data.scouted.json public/clubhub-data.json
              cp /tmp/discord-scout.scouted.json public/discord-scout.json
              git add collector/clubs.json public/clubhub-data.json public/discord-scout.json
              git commit -m "chore: auto-discover club Discord servers [skip ci]" || true
            fi
            git push origin HEAD:main || true
          fi

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_UNSAFE_DISABLE_DEVELOPMENT_MODE_CONSOLE_WARNING: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: discover-discord-servers
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
