name: Autonomous Discord & Email Integration Agent

on:
  schedule:
    # Runs autonomously every hour at :15 (offset from the :00 2-hour feed sync and :30 daily roster sync)
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      send_digest:
        description: "Also dispatch outbound upcoming event digest to configured Discord webhook/channel & Email"
        required: false
        default: false
        type: boolean
      offline_only:
        description: "Skip live Discord Invite API HTTP fetches (use cached snapshot metadata only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "discord-email-sync"
  cancel-in-progress: false

jobs:
  sync-discord-email-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Autonomous Discord & Email Integration Agent
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_AGGREGATOR_GUILD_ID: ${{ secrets.DISCORD_AGGREGATOR_GUILD_ID }}
          DISCORD_DEFAULT_CHANNEL_ID: ${{ secrets.DISCORD_DEFAULT_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_CHANNEL_MAP: ${{ secrets.DISCORD_CHANNEL_MAP }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_IMAP_HOST: ${{ secrets.EMAIL_IMAP_HOST }}
          EMAIL_IMAP_PORT: ${{ secrets.EMAIL_IMAP_PORT }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DEFAULT_TO: ${{ secrets.EMAIL_DEFAULT_TO }}
          DISCORD_EMAIL_OFFLINE: ${{ inputs.offline_only && 'true' || 'false' }}
          SEND_DIGEST: ${{ inputs.send_digest && 'true' || 'false' }}
        run: npm run sync:discord-email

      - name: Persist updated Discord & Email club snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/clubs.json public/clubhub-data.json
          if ! git diff --cached --quiet; then
            cp collector/clubs.json /tmp/clubs.synced.json
            cp public/clubhub-data.json /tmp/clubhub-data.synced.json
            git commit -m "chore: autonomous discord and email integration sync [skip ci]"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/clubs.synced.json collector/clubs.json
              cp /tmp/clubhub-data.synced.json public/clubhub-data.json
              git add collector/clubs.json public/clubhub-data.json
              git commit -m "chore: autonomous discord and email integration sync [skip ci]" || true
            fi
            git push origin HEAD:main || true
          fi

      - name: Build production bundle
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_UNSAFE_DISABLE_DEVELOPMENT_MODE_CONSOLE_WARNING: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-discord-email-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
