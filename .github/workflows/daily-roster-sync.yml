name: Daily Club Roster & Directory Sync

on:
  schedule:
    # Runs once daily at 10:30 UTC (2:30 AM PST / 3:30 AM PDT), offset from the :00 2-hour feed sync
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      offline_only:
        description: "Skip live website/Discord HTTP fetches (use cached snapshot only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-roster-sync"
  cancel-in-progress: false

jobs:
  sync-rosters-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache collector state (LLM & roster caches)
        uses: actions/cache@v4
        with:
          path: |
            collector/output/claude-cache.json
            collector/output/roster-cache.json
          key: clubhub-collector-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            clubhub-collector-cache-${{ runner.os }}-

      - name: Set up Python (for Instagram UCSC club discovery)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          pip install --quiet instaloader requests

      - name: Check Meta Graph API token health & expiry
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: npm run ig:check-token

      - name: Sync official UCSC club directory & per-club rosters
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          IG_SCRAPER_SESSION_USER: ${{ secrets.IG_SCRAPER_SESSION_USER }}
          IG_SCRAPER_SESSION_B64: ${{ secrets.IG_SCRAPER_SESSION_B64 }}
          OFFLINE_ONLY: ${{ inputs.offline_only && 'true' || 'false' }}
        run: |
          if [ "$OFFLINE_ONLY" = "true" ]; then
            node --no-warnings server/syncRosters.js --offline
          else
            npm run sync:rosters
          fi

      - name: Persist updated club catalog & roster snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/clubs.json public/clubhub-data.json
          if ! git diff --cached --quiet; then
            cp collector/clubs.json /tmp/clubs.synced.json
            cp public/clubhub-data.json /tmp/clubhub-data.synced.json
            git commit -m "chore: daily club directory and roster sync [skip ci]"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/clubs.synced.json collector/clubs.json
              cp /tmp/clubhub-data.synced.json public/clubhub-data.json
              git add collector/clubs.json public/clubhub-data.json
              git commit -m "chore: daily club directory and roster sync [skip ci]" || true
            fi
            git push origin HEAD:main || true
          fi

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_UNSAFE_DISABLE_DEVELOPMENT_MODE_CONSOLE_WARNING: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-rosters-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
