name: Deploy ClubHub to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      sync_rosters:
        description: "Also run full daily club roster & website check"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache collector state (LLM & roster caches)
        uses: actions/cache@v4
        with:
          path: |
            collector/output/claude-cache.json
            collector/output/roster-cache.json
          key: clubhub-collector-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            clubhub-collector-cache-${{ runner.os }}-

      - name: Set up Python (for Instaloader personal-account fallback)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Node + Instaloader)
        run: |
          npm install --no-audit --no-fund
          pip install --quiet instaloader requests

      - name: Sync Instagram (Business + Personal fallback), Linktrees & Discord
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_AGGREGATOR_GUILD_ID: ${{ secrets.DISCORD_AGGREGATOR_GUILD_ID }}
          DISCORD_CHANNEL_MAP: ${{ secrets.DISCORD_CHANNEL_MAP }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_IMAP_HOST: ${{ secrets.EMAIL_IMAP_HOST }}
          EMAIL_IMAP_PORT: ${{ secrets.EMAIL_IMAP_PORT }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_MAX_CLUBS: "55"
          IG_GRAPH_DELAY_MS: "800"
          INCREMENTAL_POSTS_PER_CLUB: "6"
          IG_FRESH_TTL_MIN: "55"
          IG_PERSONAL_FALLBACK: "true"
          IG_SCRAPER_STORIES: "true"
          IG_SCRAPER_MAX_CLUBS: "8"
          IG_SCRAPER_DELAY_SEC: "7"
          IG_SCRAPER_SESSION_USER: ${{ secrets.IG_SCRAPER_SESSION_USER }}
          IG_SCRAPER_SESSION_B64: ${{ secrets.IG_SCRAPER_SESSION_B64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYNC_ROSTERS: ${{ inputs.sync_rosters && 'true' || 'false' }}
        run: npm run sync:static

      - name: Persist updated snapshot on scheduled/manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/clubs.json public/clubhub-data.json
          if ! git diff --cached --quiet; then
            cp collector/clubs.json /tmp/clubs.synced.json
            cp public/clubhub-data.json /tmp/clubhub-data.synced.json
            git commit -m "chore: auto-sync club data snapshot [skip ci]"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/clubs.synced.json collector/clubs.json
              cp /tmp/clubhub-data.synced.json public/clubhub-data.json
              git add collector/clubs.json public/clubhub-data.json
              git commit -m "chore: auto-sync club data snapshot [skip ci]" || true
            fi
            git push origin HEAD:main || true
          fi

      - name: Build production bundle
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_UNSAFE_DISABLE_DEVELOPMENT_MODE_CONSOLE_WARNING: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
