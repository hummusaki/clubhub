name: Deploy ClubHub to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python (for Instaloader personal-account fallback)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Node + Instaloader)
        run: |
          npm install --no-audit --no-fund
          pip install --quiet instaloader

      - name: Sync Instagram (Business + Personal fallback), Linktrees & Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_AGGREGATOR_GUILD_ID: ${{ secrets.DISCORD_AGGREGATOR_GUILD_ID }}
          DISCORD_CHANNEL_MAP: ${{ secrets.DISCORD_CHANNEL_MAP }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_PERSONAL_FALLBACK: "true"
          IG_SCRAPER_MAX_CLUBS: "12"
          IG_SCRAPER_DELAY_SEC: "5"
          IG_SCRAPER_SESSION_USER: ${{ secrets.IG_SCRAPER_SESSION_USER }}
          IG_SCRAPER_SESSION_B64: ${{ secrets.IG_SCRAPER_SESSION_B64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run sync:static

      - name: Persist updated snapshot on scheduled/manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/clubhub-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync club data snapshot [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Build production bundle
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
