<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="ClubHub — Discover UCSC student organizations, track live club events & announcements, coordinate group availability, and sync schedules to Google & Apple Calendar."
    />
    <meta name="theme-color" content="#DFDDD5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080C14" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClubHub" />
    <meta property="og:title" content="ClubHub — Campus Workspace" />
    <meta
      property="og:description"
      content="All your UCSC campus clubs, live events, announcements, shared links, and group scheduling in one workspace."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ClubHub — Campus Workspace" />
    <meta
      name="twitter:description"
      content="All your UCSC campus clubs, live events, announcements, shared links, and group scheduling in one workspace."
    />
    <style>
      html {
        background-color: #DFDDD5;
        color: #1F242C;
        color-scheme: light;
        min-height: 100%;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light) {
          background-color: #080C14;
          color: #F4F7FF;
          color-scheme: dark;
        }
      }
      html.dark {
        background-color: #080C14;
        color: #F4F7FF;
        color-scheme: dark;
      }
      body,
      #root {
        background-color: inherit;
        color: inherit;
        min-height: 100dvh;
      }
    </style>
    <script>
      (function () {
        try {
          var isValidMode = function (m) {
            return m === 'system' || m === 'light' || m === 'dark';
          };

          var reduceMotion = false;
          var compactCards = false;

          var rawSettings = localStorage.getItem('clubhub_user_settings_v1');
          var settings = rawSettings ? JSON.parse(rawSettings) : null;
          if (settings && settings.reduceMotion) {
            reduceMotion = true;
          }
          if (settings && settings.compactCards) {
            compactCards = true;
          }

          var rawUser = localStorage.getItem('clubhub_auth_user');
          var parsedUser = rawUser ? JSON.parse(rawUser) : null;
          var rawMap = localStorage.getItem('clubhub_account_themes_v2');
          var themeMap = rawMap ? JSON.parse(rawMap) : {};
          var lastAcct = localStorage.getItem('clubhub_last_active_account_v1');

          var mode = null;

          if (parsedUser && parsedUser.email) {
            var emailKey = 'email:' + String(parsedUser.email).toLowerCase();
            if (isValidMode(parsedUser.themeMode)) {
              mode = parsedUser.themeMode;
            } else if (isValidMode(themeMap[emailKey])) {
              mode = themeMap[emailKey];
            }
          }

          if (!mode && lastAcct && isValidMode(themeMap[lastAcct])) {
            mode = themeMap[lastAcct];
          }

          if (!mode && settings && isValidMode(settings.themeMode)) {
            mode = settings.themeMode;
          }

          if (!mode) {
            var guestMode = localStorage.getItem('clubhub_guest_theme_mode_v1');
            if (isValidMode(guestMode)) {
              mode = guestMode;
            }
          }

          if (!mode) {
            mode = 'system';
          }

          var isDark =
            mode === 'dark'
              ? true
              : mode === 'light'
                ? false
                : Boolean(
                    window.matchMedia &&
                      window.matchMedia('(prefers-color-scheme: dark)').matches
                  );

          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          }
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', isDark ? '#080C14' : '#DFDDD5');
          }
          if (reduceMotion) {
            root.classList.add('reduce-motion');
          }
          if (compactCards) {
            root.classList.add('compact-cards');
          }
        } catch (e) {
          // Ignore storage read errors
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/clubhub-logo.svg" />
    <link rel="apple-touch-icon" href="/clubhub-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>ClubHub — Campus Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
