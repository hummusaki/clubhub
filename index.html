<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ClubHub — Discover UCSC student organizations, track live club events & announcements, coordinate group availability, and sync schedules to Google & Apple Calendar."
    />
    <meta name="theme-color" content="#F8FAFD" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClubHub" />
    <meta property="og:title" content="ClubHub — Campus Workspace" />
    <meta
      property="og:description"
      content="All your UCSC campus clubs, live events, announcements, shared links, and group scheduling in one workspace."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ClubHub — Campus Workspace" />
    <meta
      name="twitter:description"
      content="All your UCSC campus clubs, live events, announcements, shared links, and group scheduling in one workspace."
    />
    <style>
      @layer base {
        html,
        body,
        #root {
          background-color: #F8FAFD;
          color: #1F1F1F;
        }
        html {
          color-scheme: light;
          min-height: 100%;
        }
        body,
        #root {
          min-height: 100vh;
        }
        @media (prefers-color-scheme: dark) {
          html:not(.light),
          html:not(.light) body,
          html:not(.light) #root {
            background-color: #131314;
            color: #E3E3E3;
          }
          html:not(.light) {
            color-scheme: dark;
          }
        }
        html.dark,
        html.dark body,
        html.dark #root {
          background-color: #131314;
          color: #E3E3E3;
        }
        html.dark {
          color-scheme: dark;
        }
      }
    </style>
    <script>
      (function () {
        var dark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.add(dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#131314' : '#F8FAFD');

        try {
          var settings = JSON.parse(localStorage.getItem('clubhub_user_settings_v1'));
          if (settings && settings.reduceMotion) root.classList.add('reduce-motion');
          if (settings && settings.compactCards) root.classList.add('compact-cards');
        } catch (e) {
          // Ignore storage read errors
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/clubhub-logo.svg" />
    <link rel="apple-touch-icon" href="/clubhub-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>ClubHub — Campus Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
